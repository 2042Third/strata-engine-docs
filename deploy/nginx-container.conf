# The container's only server: the book on port 8080 (deploy/Dockerfile).
server {
	# IPv4 only. nginx refuses to start when it cannot open a socket of a family the kernel lacks, and a container may
	# run without IPv6 (the image's own entrypoint adds "[::]" only after finding /proc/net/if_inet6). The host's
	# nginx reaches the container on 127.0.0.1 (deploy/nginx-proxy.conf), so nothing needs IPv6 here.
	listen 8080;
	server_name _;
	server_tokens off;

	include /etc/nginx/snippets/strata-engine-docs.conf;

	# Nothing else is served: the book does not need the host's root. (outside: begin)
	location / {
		return 404;
	}
	# (outside: end)
}
