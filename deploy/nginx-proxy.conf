# The Strata Engine Book in its container (deploy/Dockerfile, on 127.0.0.1:8080), behind the host's nginx: paste these
# lines into the server block of the site that hosts the book. Tested with nginx 1.20.1 and 1.30.6.

# (redirect: begin)
location = /strata-engine-docs {
	absolute_redirect off;
	return 301 /strata-engine-docs/;
}
# (redirect: end)

# ^~ keeps the host's regular-expression locations (such as "location ~* \.(css|js)$") from taking these addresses.
location ^~ /strata-engine-docs/ {
	proxy_pass http://127.0.0.1:8080;         # no URI part: the prefix reaches the container unchanged
	# nginx before 1.29.7 asks over HTTP/1.0 by default, and nginx compresses nothing for a request of HTTP/1.0
	# (gzip_http_version 1.1): the container would send every page uncompressed.
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

	# The container sends the book's headers. A location without an add_header inherits those of the server block, so
	# a host that sends X-Frame-Options or X-Content-Type-Options from its server block would send them a second time
	# beside the container's. This add_header ends that inheritance and adds nothing: nginx never sends a header whose
	# value is empty.
	add_header X-Strata-Docs "" always;
	# The host's "expires" would add a second Cache-Control beside the container's.
	expires off;
	# Headers of the host that must also reach the book's pages go into such a file, as in the copied-files way. The
	# name holds a wildcard, so the include may match no file.
	include /etc/nginx/snippets/strata-engine-docs-host-headers*.conf;
}
