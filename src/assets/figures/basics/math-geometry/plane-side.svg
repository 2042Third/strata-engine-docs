<line class="line-blue" x1="294" y1="280" x2="294" y2="232" stroke-width="2.5"/>
<polygon class="blue" points="294,220 298.5,232 289.5,232"/>
<text class="blue" x="304" y="255">n = (0, 1)</text>
<line class="line-blue" x1="414" y1="100" x2="414" y2="280" stroke-width="2" stroke-dasharray="4 3"/>
<circle class="ink" cx="414" cy="100" r="5"/>
<text class="ink" x="426" y="105">A (3, 5)</text>
<text class="blue bold" x="424" y="195">s = +3</text>
<line class="line-purple" x1="234" y1="400" x2="234" y2="280" stroke-width="2" stroke-dasharray="4 3"/>
<circle class="ink" cx="234" cy="400" r="5"/>
<text class="ink" x="246" y="420">B (0, 0)</text>
<text class="purple bold" x="224" y="345" text-anchor="end">s = −2</text>
<text class="blue" x="582" y="75" text-anchor="end">s &gt; 0</text>
<text class="purple" x="582" y="435" text-anchor="end">s &lt; 0</text>
</svg>
