<line class="line-faint" x1="174" y1="280" x2="594" y2="280" stroke-width="1"/>
<text class="muted small" x="354" y="482" text-anchor="middle">2</text>
<text class="muted small" x="164" y="285" text-anchor="end">2</text>
<line class="line-faint" x1="414" y1="460" x2="414" y2="40" stroke-width="1"/>
<line class="line-faint" x1="174" y1="220" x2="594" y2="220" stroke-width="1"/>
<text class="muted small" x="414" y="482" text-anchor="middle">3</text>
<text class="muted small" x="164" y="225" text-anchor="end">3</text>
<line class="line-faint" x1="474" y1="460" x2="474" y2="40" stroke-width="1"/>
<line class="line-faint" x1="174" y1="160" x2="594" y2="160" stroke-width="1"/>
<text class="muted small" x="474" y="482" text-anchor="middle">4</text>
<text class="muted small" x="164" y="165" text-anchor="end">4</text>
<line class="line-faint" x1="534" y1="460" x2="534" y2="40" stroke-width="1"/>
<line class="line-faint" x1="174" y1="100" x2="594" y2="100" stroke-width="1"/>
<text class="muted small" x="534" y="482" text-anchor="middle">5</text>
<text class="muted small" x="164" y="105" text-anchor="end">5</text>
<line class="line-faint" x1="594" y1="460" x2="594" y2="40" stroke-width="1"/>
<line class="line-faint" x1="174" y1="40" x2="594" y2="40" stroke-width="1"/>
<text class="muted small" x="594" y="482" text-anchor="middle">6</text>
<text class="muted small" x="164" y="45" text-anchor="end">6</text>
<line class="line-ink" x1="174" y1="280" x2="594" y2="280" stroke-width="2.5"/>
