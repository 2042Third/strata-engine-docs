<text class="green bold halo" x="469" y="265">b = (1, 2)</text>
<text class="orange bold halo" x="334" y="280" text-anchor="end">a + b = (4, 3)</text>
<text class="small muted halo" x="426" y="352">(3, 1)</text>
<text class="small muted halo" x="500" y="184">(4, 3)</text>
</svg>
