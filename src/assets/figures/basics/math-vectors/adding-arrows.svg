<line class="line-orange" x1="210" y1="400" x2="480.4" y2="197.2" stroke-width="2.5"/>
<polygon class="orange" points="490,190 483.1,200.8 477.7,193.6"/>
<line class="line-blue" x1="210" y1="400" x2="408.6" y2="333.8" stroke-width="2.5"/>
<polygon class="blue" points="420,330 410,338.1 407.2,329.5"/>
<line class="line-green" x1="420" y1="330" x2="484.6" y2="200.7" stroke-width="2.5"/>
