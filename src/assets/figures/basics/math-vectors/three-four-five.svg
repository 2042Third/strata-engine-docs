<text class="bold" x="394" y="312" text-anchor="middle">3</text>
<text class="bold" x="432" y="226" text-anchor="middle">4</text>
<text class="bold" x="392" y="258" text-anchor="middle">5</text>
<text class="small muted" x="316" y="340" text-anchor="end">(0, 0)</text>
<text class="small muted" x="452" y="340">(3, 0)</text>
<text class="small muted" x="452" y="152">(3, 4)</text>
</svg>
