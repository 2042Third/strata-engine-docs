<rect class="line-ink" fill="none" x="284" y="56" width="200" height="200"/>
<text class="ink" x="384" y="282" text-anchor="middle">half the squares white</text>
<text class="ink" x="384" y="304" text-anchor="middle">light 0.5 on average</text>
<text class="ink bold" x="624" y="40" text-anchor="middle">Blend in linear light</text>
<rect class="swatch" x="524" y="56" width="200" height="200" fill="#bcbcbc"/>
<rect class="line-ink" fill="none" x="524" y="56" width="200" height="200"/>
