<text class="ink" x="504" y="338" text-anchor="middle">1.5</text>
<line class="line-ink" x1="624" y1="312" x2="624" y2="318"/>
<text class="ink" x="624" y="338" text-anchor="middle">2</text>
<line class="line-ink" x1="138" y1="192" x2="144" y2="192"/>
