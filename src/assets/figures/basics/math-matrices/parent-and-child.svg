<line class="line-blue" x1="420" y1="330" x2="291.3" y2="222" stroke-width="2.5"/>
<text class="blue bold halo" x="351.7" y="298" text-anchor="end">3 back</text>
<line class="line-blue" x1="291.3" y1="222" x2="291.3" y2="150" stroke-width="2" stroke-dasharray="4 3"/>
<circle class="blue" cx="291.3" cy="222" r="4"/>
<text class="blue bold halo" x="299.3" y="187">1 up</text>
<line class="line-purple" x1="414.6" y1="245.5" x2="240.4" y2="99.3" stroke-width="2.5"/>
<polygon class="purple" points="231.2,91.6 243.3,95.9 237.5,102.8"/>
<text class="purple bold" x="221.2" y="89.6" text-anchor="end">parent's x</text>
<line class="line-muted" x1="426" y1="250" x2="500" y2="250" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="muted" x="508" y="255">x before the turn</text>
<path class="line-muted" fill="none" d="M460.0 250.0 L458.7 249.0 L457.4 248.0 L455.9 247.0 L454.3 246.0 L452.6 245.1 L450.8 244.1 L448.9 243.2 L446.9 242.3 L444.8 241.4 L442.7 240.5 L440.4 239.7 L438.2 238.9 L435.8 238.1 L433.4 237.4 L431.0 236.7 L428.6 236.0 L426.1 235.4 L423.6 234.9 L421.0 234.3 L418.5 233.9 L416.0 233.4 L413.5 233.1 L411.0 232.8 L408.6 232.5"/>
<polygon class="muted" points="398.6,232 408.8,229 408.4,236"/>
