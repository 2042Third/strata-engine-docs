<circle class="orange-area line-orange" cx="291.3" cy="142" r="7" stroke-width="2.5"/>
<text class="orange bold halo" x="275.3" y="146" text-anchor="end">coin (child)</text>
<text class="purple halo" x="275.3" y="166" text-anchor="end">local (3, 0, 0)</text>
<text class="blue halo" x="275.3" y="186" text-anchor="end">world (0, 1, −3)</text>
</g>
</svg>
