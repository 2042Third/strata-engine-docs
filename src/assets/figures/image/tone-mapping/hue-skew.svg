svg.book-drawing .red-area { fill: var(--sl-color-red-low, #fad1df); }
svg.book-drawing .line-red-area { stroke: var(--sl-color-red-low, #fad1df); }
svg.book-drawing .small { font-size: 14px; }
svg.book-drawing .large { font-size: 20px; }
svg.book-drawing .bold { font-weight: 600; }
svg.book-drawing .mono { font-family: var(--sl-font-mono, 'JetBrains Mono Variable', ui-monospace, monospace); }
svg.book-drawing .halo { paint-order: stroke; stroke: var(--sl-color-black, #ffffff); stroke-width: 5px; }
</style>
<!-- hue-skew: the hue wheel seen from above, center (230, 226), radius 190 = the display limit. A color sits at its hue angle (red at 0, yellow at 60 degrees, counterclockwise) and at the distance (largest - smallest channel) / min(largest, 1): its saturation while the largest channel is at most 1, its spread against white once it passes 1, so a color outside the circle cannot be shown. Paths: the lantern (4, 1, 0.25) times 2^e for e from -8 up, through Reinhard per channel, Reinhard on luminance and Filmic (Toe, Shoulder 0.5); computed in docs-work/draw/image-tone-mapping/curves.py. Dots: e = 0, the page's numbers. H = 446 -->
