<text class="muted small" x="244" y="132">game at its next fixed step.</text>
<text class="ink" x="244" y="189">Contact recycle distance (m)</text>
<rect class="plate" x="560" y="170" width="176" height="28" rx="3"/>
<text class="ink mono" x="572" y="189">0.05</text>
<text class="ink" x="244" y="225">Sleep threshold (m/s)</text>
<rect class="plate" x="560" y="206" width="176" height="28" rx="3"/>
<text class="ink mono" x="572" y="225">0.08</text>
<text class="ink" x="244" y="261">Contact stiffness (Hz)</text>
<rect class="plate" x="560" y="242" width="176" height="28" rx="3"/>
<text class="ink mono" x="572" y="261">30</text>
<text class="ink" x="244" y="297">Contact damping</text>
<rect class="plate" x="560" y="278" width="176" height="28" rx="3"/>
<text class="ink mono" x="572" y="297">10</text>
<text class="ink" x="244" y="333">Overlap push speed (m/s)</text>
<rect class="plate" x="560" y="314" width="176" height="28" rx="3"/>
<text class="ink mono" x="572" y="333">3</text>
<rect class="line-muted" fill="none" x="244" y="352" width="168" height="30" rx="3"/>
<text class="muted" x="258" y="372">Reset to Defaults</text>
<line class="line-orange" x1="648" y1="354" x2="648" y2="416"/>
<polygon class="orange" points="648,344 644.5,354 651.5,354"/>
<text class="orange small" x="648" y="432" text-anchor="middle">Each value at its default</text>
<line class="line-orange" x1="300" y1="394" x2="300" y2="416"/>
<polygon class="orange" points="300,384 296.5,394 303.5,394"/>
<text class="orange small" x="244" y="432">Dimmed until the project stores the section</text>
<text class="orange small" x="244" y="462">Each label&#8217;s tooltip gives the range, the default and the effect.</text>
