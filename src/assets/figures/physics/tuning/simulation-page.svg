<text class="muted small" x="36" y="112">Physics</text>
<text class="ink" x="36" y="140">Collision Layers</text>
<text class="ink" x="36" y="168">Timing</text>
<rect class="blue-area" x="24" y="178" width="176" height="28" rx="3"/>
