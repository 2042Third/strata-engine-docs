<text class="ink bold" x="520" y="36">A dropped after B, expanded</text>
<rect class="plate" x="520" y="48" width="232" height="176"/>
<text class="ink" x="548" y="77">A</text>
<polygon class="muted" points="532,100 542,100 537,107"/>
<text class="ink" x="548" y="109">B</text>
<text class="ink" x="568" y="141">X</text>
<text class="ink" x="568" y="173">Y</text>
<text class="ink" x="548" y="205">C</text>
