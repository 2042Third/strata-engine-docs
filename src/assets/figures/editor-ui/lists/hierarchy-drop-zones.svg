<text class="ink bold" x="144" y="292">The zones of one row, by the pointer&#8217;s height in it</text>
<rect class="blue-area line-blue" stroke-width="2" x="144" y="348" width="480" height="80"/>
<rect fill="none" class="line-muted" x="144" y="308" width="480" height="160"/>
<line class="line-blue" stroke-width="2.5" x1="152" y1="308" x2="624" y2="308"/>
<circle class="blue" cx="152" cy="308" r="4"/>
<line class="line-blue" stroke-width="2.5" x1="152" y1="468" x2="624" y2="468"/>
<circle class="blue" cx="152" cy="468" r="4"/>
<text class="ink" text-anchor="middle" x="384" y="334">Top quarter: before the row&#8217;s entity</text>
