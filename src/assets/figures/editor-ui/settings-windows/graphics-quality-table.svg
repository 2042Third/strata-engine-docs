<!--
Plan. Five chips at y 20 to 48. The table from x 16 to 751: the setting column 16 to 266, then Low, Medium, High,
Ultra and Custom, 97 each (centers 314.5, 411.5, 508.5, 605.5, 702.5). Header y 64 to 92, the first five rows of 32 to 252,
a row naming the rest to 280, the two memory lines to 328. High, the default preset, is the chosen column: its band
runs from the header to the memory lines. Players' choices at y 356 and 378. Notes from y 416, 24 apart; H = 512 + 20.
Facts (StrataEditor/src/UI/GraphicsQualityPage.cpp at 319075e3): chips and columns Low, Medium, High, Ultra, Custom;
chosen column on AccentMuted with the accent header; preset cells as text, Custom's cell a widget in secondary text
under a named preset; after the rows the lines "Memory at 1920 x 1080" and "at 3840 x 2160", one value per column;
then "Players' choices". Rows and values: c_*Row in Strata/src/Strata/Renderer/RendererQuality.cpp; 16 rows follow
the preset (c_RowTraits), 5 do not (AntiAliasing, MotionBlur, DepthOfField, FilmGrain, ChromaticAberration).
-->
