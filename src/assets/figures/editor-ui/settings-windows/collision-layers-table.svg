<!--
Plan. A project with layers 1 Player, 2 Enemy and 3 Coin named, where Enemy and Coin pass through each other and so do
Player and layer 5. Summary at y 32; the names, rows of 36 from y 48 (label x 24, field x 100 to 320, clear button
at 340); Name a Layer at y 160 to 188. "Which layers collide" at y 222; header y 232 to 256 (column centers 148 + 32 i);
rows of 32 from 256 to 416: shown layers 0, 1, 2, 3, 5. Notes at x 316 beside the rows; under the matrix from y 444.
H = 488 + 20.
Facts (StrataEditor/src/UI/CollisionLayersPage.cpp at 319075e3): Describe makes "3 named · 2 pairs pass through" and
shows layer 0, the named layers and those that do not collide with all; labels "<index> · <name>", unnamed
"Layer <index>" (PhysicsLayerSettings::GetDisplayName); a box for each pair once, the row's layer with every shown
layer up to it; a cleared box lets the pair pass through each other.
-->
