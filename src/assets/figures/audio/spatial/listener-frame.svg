<svg xmlns="http://www.w3.org/2000/svg" class="book-drawing" viewBox="0 0 768 400">
<style>
svg.book-drawing { font-family: var(--sl-font, 'Inter Variable', system-ui, sans-serif); font-size: 16px; fill: var(--sl-color-white, #17181c); stroke: none; stroke-width: 1.5px; stroke-linejoin: round; }
svg.book-drawing text { stroke: none; }
svg.book-drawing .ink { fill: var(--sl-color-white, #17181c); }
svg.book-drawing .line-ink { stroke: var(--sl-color-white, #17181c); }
svg.book-drawing .muted { fill: var(--sl-color-gray-3, #555962); }
svg.book-drawing .line-muted { stroke: var(--sl-color-gray-3, #555962); }
svg.book-drawing .faint { fill: var(--sl-color-gray-5, #c1c3c8); }
svg.book-drawing .line-faint { stroke: var(--sl-color-gray-5, #c1c3c8); }
svg.book-drawing .ground { fill: var(--sl-color-black, #ffffff); }
svg.book-drawing .line-ground { stroke: var(--sl-color-black, #ffffff); }
svg.book-drawing .plate { fill: var(--sl-color-gray-6, #edeef3); }
svg.book-drawing .line-plate { stroke: var(--sl-color-gray-6, #edeef3); }
svg.book-drawing .blue { fill: var(--sl-color-blue-high, #0f1c8a); }
svg.book-drawing .line-blue { stroke: var(--sl-color-blue-high, #0f1c8a); }
svg.book-drawing .blue-area { fill: var(--sl-color-blue-low, #cfd4fc); }
svg.book-drawing .line-blue-area { stroke: var(--sl-color-blue-low, #cfd4fc); }
svg.book-drawing .green { fill: var(--sl-color-green-high, #28650b); }
svg.book-drawing .line-green { stroke: var(--sl-color-green-high, #28650b); }
svg.book-drawing .green-area { fill: var(--sl-color-green-low, #defbd0); }
svg.book-drawing .line-green-area { stroke: var(--sl-color-green-low, #defbd0); }
svg.book-drawing .purple { fill: var(--sl-color-purple-high, #660891); }
svg.book-drawing .line-purple { stroke: var(--sl-color-purple-high, #660891); }
svg.book-drawing .purple-area { fill: var(--sl-color-purple-low, #edd1fa); }
svg.book-drawing .line-purple-area { stroke: var(--sl-color-purple-low, #edd1fa); }
svg.book-drawing .orange { fill: var(--sl-color-orange-high, #73520d); }
svg.book-drawing .line-orange { stroke: var(--sl-color-orange-high, #73520d); }
svg.book-drawing .orange-area { fill: var(--sl-color-orange-low, #fceac5); }
svg.book-drawing .line-orange-area { stroke: var(--sl-color-orange-low, #fceac5); }
svg.book-drawing .red { fill: var(--sl-color-red-high, #8a0f3a); }
svg.book-drawing .line-red { stroke: var(--sl-color-red-high, #8a0f3a); }
svg.book-drawing .red-area { fill: var(--sl-color-red-low, #fad1df); }
svg.book-drawing .line-red-area { stroke: var(--sl-color-red-low, #fad1df); }
svg.book-drawing .small { font-size: 14px; }
svg.book-drawing .large { font-size: 20px; }
svg.book-drawing .bold { font-weight: 600; }
svg.book-drawing .mono { font-family: var(--sl-font-mono, 'JetBrains Mono Variable', ui-monospace, monospace); }
svg.book-drawing .halo { paint-order: stroke; stroke: var(--sl-color-black, #ffffff); stroke-width: 5px; }
</style>
<!-- plan: two panels 384 wide, listeners at (192, 180) and (576, 180); seen from above, +X right, +Z down the
page, +Y out of it. Head r 22, nose 34 toward forward, ears r 6 at x +-25; forward arrows 112 long from the
centre, right arrows from 32 to 122; source at listener + (120, -72) in world terms in both panels. H 400. -->
<text x="192" y="32" text-anchor="middle" class="bold ink">No rotation</text>
<text x="576" y="32" text-anchor="middle" class="bold ink">Turned round</text>
<line x1="384" y1="16" x2="384" y2="330" class="line-faint" stroke-width="1"/>
<line x1="302.4" y1="115.2" x2="224.2" y2="174.6" class="line-orange" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="192.0" y1="144.0" x2="192.0" y2="78.0" class="line-ink" stroke-width="2"/>
<polygon points="192.0,68.0 195.5,78.0 188.5,78.0" class="ink"/>
<text x="192" y="56" text-anchor="middle" class="ink">forward, −Z</text>
<line x1="224.0" y1="180.0" x2="304.0" y2="180.0" class="line-ink" stroke-width="2"/>
<polygon points="314.0,180.0 304.0,183.5 304.0,176.5" class="ink"/>
<text x="269" y="206" text-anchor="middle" class="ink">right, +X</text>
<text x="269" y="226" text-anchor="middle" class="small muted">forward × up</text>
<polygon points="192,146 183,161 201,161" class="plate line-ink" stroke-width="2"/>
<circle cx="192" cy="180" r="22" class="plate line-ink" stroke-width="2"/>
<circle cx="167" cy="180" r="6" class="plate line-ink" stroke-width="1.5"/>
<circle cx="217" cy="180" r="6" class="orange-area line-orange" stroke-width="2"/>
<text x="182" y="185" text-anchor="middle" class="small bold ink">L</text>
<text x="202" y="185" text-anchor="middle" class="small bold ink">R</text>
<circle cx="312" cy="108" r="9" class="orange-area line-orange" stroke-width="2"/>
<text x="312" y="90" text-anchor="middle" class="orange">source</text>
<line x1="686.4" y1="115.2" x2="608.2" y2="174.6" class="line-orange" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="576.0" y1="216.0" x2="576.0" y2="282.0" class="line-ink" stroke-width="2"/>
<polygon points="576.0,292.0 572.5,282.0 579.5,282.0" class="ink"/>
<text x="576" y="314" text-anchor="middle" class="ink">forward, +Z</text>
<line x1="544.0" y1="180.0" x2="464.0" y2="180.0" class="line-ink" stroke-width="2"/>
<polygon points="454.0,180.0 464.0,176.5 464.0,183.5" class="ink"/>
<text x="499" y="206" text-anchor="middle" class="ink">right, −X</text>
<text x="499" y="226" text-anchor="middle" class="small muted">forward × up</text>
<polygon points="576,214 567,199 585,199" class="plate line-ink" stroke-width="2"/>
<circle cx="576" cy="180" r="22" class="plate line-ink" stroke-width="2"/>
<circle cx="551" cy="180" r="6" class="plate line-ink" stroke-width="1.5"/>
<circle cx="601" cy="180" r="6" class="orange-area line-orange" stroke-width="2"/>
<text x="566" y="185" text-anchor="middle" class="small bold ink">R</text>
<text x="586" y="185" text-anchor="middle" class="small bold ink">L</text>
<circle cx="696" cy="108" r="9" class="orange-area line-orange" stroke-width="2"/>
<text x="696" y="90" text-anchor="middle" class="orange">source</text>
<text x="192" y="352" text-anchor="middle" class="ink">Louder in the right ear</text>
<text x="576" y="352" text-anchor="middle" class="ink">Louder in the left ear</text>
<text x="384" y="382" text-anchor="middle" class="muted">Seen from above: up, +Y, points out of the page</text>
</svg>
