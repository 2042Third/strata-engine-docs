<polyline points="300,220 306.8,220.1 313.5,220.3 320.3,220.7 327.1,221.2 333.9,221.9 340.6,222.7 347.4,223.7 354.2,224.8 361,226.1 367.7,227.5 374.5,229.1 381.3,230.8 388,232.7 394.8,234.7 401.6,236.9 408.4,239.2 415.1,241.7 421.9,244.3 428.7,247.1 435.5,250 442.2,253.1 449,256.3 455.8,259.7 462.5,263.2 469.3,266.9 476.1,270.7 482.9,274.7 489.6,278.8 496.4,283.1 503.2,287.5 510,292.1 516.7,296.8 523.5,301.7 530.3,306.7 537,311.9 543.8,317.2 550.6,322.7 557.4,328.3 564.1,334.1 561.9,332.1" class="line-blue" fill="none" stroke-width="3"/>
<rect x="300" y="236" width="90" height="16" class="orange-area line-orange"/>
<text x="304" y="272" class="orange bold small">coyote window</text>
<text x="304" y="290" class="orange small">0.15 s, 0.75 m</text>
<line x1="360" y1="219.9" x2="360" y2="150" class="line-green" fill="none"/>
<circle cx="360" cy="225.9" r="5" class="green"/>
<text x="366" y="154" class="green">jump pressed at 0.10 s: counts</text>
<line x1="420" y1="237.5" x2="420" y2="186" class="line-red" fill="none"/>
<circle cx="420" cy="243.5" r="5" class="ground line-red"/>
