<svg xmlns="http://www.w3.org/2000/svg" class="book-drawing" viewBox="0 0 768 448">
<style>
svg.book-drawing { font-family: var(--sl-font, 'Inter Variable', system-ui, sans-serif); font-size: 16px; fill: var(--sl-color-white, #17181c); stroke: none; stroke-width: 1.5px; stroke-linejoin: round; }
svg.book-drawing text { stroke: none; }
svg.book-drawing .ink { fill: var(--sl-color-white, #17181c); }
svg.book-drawing .line-ink { stroke: var(--sl-color-white, #17181c); }
svg.book-drawing .muted { fill: var(--sl-color-gray-3, #555962); }
svg.book-drawing .line-muted { stroke: var(--sl-color-gray-3, #555962); }
svg.book-drawing .faint { fill: var(--sl-color-gray-5, #c1c3c8); }
svg.book-drawing .line-faint { stroke: var(--sl-color-gray-5, #c1c3c8); }
svg.book-drawing .ground { fill: var(--sl-color-black, #ffffff); }
svg.book-drawing .line-ground { stroke: var(--sl-color-black, #ffffff); }
svg.book-drawing .plate { fill: var(--sl-color-gray-6, #edeef3); }
svg.book-drawing .line-plate { stroke: var(--sl-color-gray-6, #edeef3); }
svg.book-drawing .blue { fill: var(--sl-color-blue-high, #0f1c8a); }
svg.book-drawing .line-blue { stroke: var(--sl-color-blue-high, #0f1c8a); }
svg.book-drawing .blue-area { fill: var(--sl-color-blue-low, #cfd4fc); }
svg.book-drawing .line-blue-area { stroke: var(--sl-color-blue-low, #cfd4fc); }
svg.book-drawing .green { fill: var(--sl-color-green-high, #28650b); }
svg.book-drawing .line-green { stroke: var(--sl-color-green-high, #28650b); }
svg.book-drawing .green-area { fill: var(--sl-color-green-low, #defbd0); }
svg.book-drawing .line-green-area { stroke: var(--sl-color-green-low, #defbd0); }
svg.book-drawing .purple { fill: var(--sl-color-purple-high, #660891); }
svg.book-drawing .line-purple { stroke: var(--sl-color-purple-high, #660891); }
svg.book-drawing .purple-area { fill: var(--sl-color-purple-low, #edd1fa); }
svg.book-drawing .line-purple-area { stroke: var(--sl-color-purple-low, #edd1fa); }
svg.book-drawing .orange { fill: var(--sl-color-orange-high, #73520d); }
svg.book-drawing .line-orange { stroke: var(--sl-color-orange-high, #73520d); }
svg.book-drawing .orange-area { fill: var(--sl-color-orange-low, #fceac5); }
svg.book-drawing .line-orange-area { stroke: var(--sl-color-orange-low, #fceac5); }
svg.book-drawing .red { fill: var(--sl-color-red-high, #8a0f3a); }
svg.book-drawing .line-red { stroke: var(--sl-color-red-high, #8a0f3a); }
svg.book-drawing .red-area { fill: var(--sl-color-red-low, #fad1df); }
svg.book-drawing .line-red-area { stroke: var(--sl-color-red-low, #fad1df); }
svg.book-drawing .small { font-size: 14px; }
svg.book-drawing .large { font-size: 20px; }
svg.book-drawing .bold { font-weight: 600; }
svg.book-drawing .mono { font-family: var(--sl-font-mono, 'JetBrains Mono Variable', ui-monospace, monospace); }
svg.book-drawing .halo { paint-order: stroke; stroke: var(--sl-color-black, #ffffff); stroke-width: 5px; }
</style>
<!-- the drawing: roles as classes (plan/card/drawing.md) -->
<!-- grid: left box x 16..416 (tools shown), right x 476..748 (12 other toolsets in 3 columns of 88, rows 36 apart from y 60),
     bottom bar y 392..432 (every command); H = 432 + 16 -->
<rect x="16" y="16" width="400" height="340" rx="8" fill="none" class="line-muted"/>
<text x="32" y="44" class="ink bold">Tools the agent sees</text>
<rect x="32" y="60" width="368" height="60" rx="6" class="blue-area"/>
<text x="48" y="86" class="blue bold mono">core</text>
<text x="48" y="108" class="ink small">enabled at the start · 27 commands</text>
<rect x="32" y="132" width="368" height="118" rx="6" class="plate"/>
<text x="48" y="156" class="ink">Five generic tools</text>
<text x="48" y="184" class="ink mono small">strata_status</text>
<text x="48" y="208" class="ink mono small">strata_launch_editor</text>
<text x="48" y="232" class="ink mono small">strata_describe</text>
<text x="240" y="184" class="ink mono small">strata_toolsets</text>
<text x="240" y="208" class="ink mono small">strata_call</text>
<text x="32" y="276" class="muted small">At the start: 32 tools at most</text>
<rect x="32" y="288" width="368" height="52" rx="6" class="orange-area line-orange" stroke-dasharray="4 3"/>
<text x="48" y="310" class="orange bold">scene, once enabled</text>
<text x="48" y="330" class="ink small">its commands as tools, <tspan class="mono">asset.place</tspan> among them</text>
<text x="476" y="44" class="ink bold">Other toolsets, not tools yet</text>
<rect x="476" y="60" width="88" height="28" rx="6" class="orange-area line-orange"/>
<text x="520" y="79" class="mono small orange" text-anchor="middle">scene</text>
<rect x="568" y="60" width="88" height="28" rx="6" class="plate"/>
<text x="612" y="79" class="mono small ink" text-anchor="middle">assets</text>
<rect x="660" y="60" width="88" height="28" rx="6" class="plate"/>
<text x="704" y="79" class="mono small ink" text-anchor="middle">play</text>
<rect x="476" y="96" width="88" height="28" rx="6" class="plate"/>
<text x="520" y="115" class="mono small ink" text-anchor="middle">scripts</text>
<rect x="568" y="96" width="88" height="28" rx="6" class="plate"/>
<text x="612" y="115" class="mono small ink" text-anchor="middle">animation</text>
<rect x="660" y="96" width="88" height="28" rx="6" class="plate"/>
<text x="704" y="115" class="mono small ink" text-anchor="middle">viewport</text>
<rect x="476" y="132" width="88" height="28" rx="6" class="plate"/>
<text x="520" y="151" class="mono small ink" text-anchor="middle">streaming</text>
<rect x="568" y="132" width="88" height="28" rx="6" class="plate"/>
<text x="612" y="151" class="mono small ink" text-anchor="middle">perf</text>
<rect x="660" y="132" width="88" height="28" rx="6" class="plate"/>
<text x="704" y="151" class="mono small ink" text-anchor="middle">editor</text>
<rect x="476" y="168" width="88" height="28" rx="6" class="plate"/>
<text x="520" y="187" class="mono small ink" text-anchor="middle">ui</text>
<rect x="568" y="168" width="88" height="28" rx="6" class="plate"/>
<text x="612" y="187" class="mono small ink" text-anchor="middle">world</text>
<rect x="660" y="168" width="88" height="28" rx="6" class="plate"/>
<text x="704" y="187" class="mono small ink" text-anchor="middle">settings</text>
<polyline points="476,74 444,74 444,314 412,314" fill="none" class="line-orange"/>
<polygon points="402,314 412,310.5 412,317.5" class="orange"/>
<text x="456" y="250" class="orange mono">strata_toolsets</text>
<text x="456" y="272" class="ink mono small">{"enable": ["scene"]}</text>
<rect x="16" y="392" width="736" height="40" rx="6" class="plate"/>
<text x="384" y="417" class="ink" text-anchor="middle">Every command of the editor</text>
<line x1="216" y1="356" x2="216" y2="380" class="line-ink" stroke-dasharray="4 3"/>
<polygon points="216,390 212.5,380 219.5,380" class="ink"/>
<text x="228" y="379" class="ink small"><tspan class="mono">strata_call</tspan>: any command, listed as a tool or not</text>
</svg>
