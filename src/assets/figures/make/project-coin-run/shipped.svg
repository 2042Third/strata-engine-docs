<text class="ink mono" x="464" y="116">CoinRun.stpak</text>
<text class="ink small" x="464" y="136">the pack: what the scenes use, and the list</text>
<text class="ink mono" x="464" y="160">CoinRunScripts.dll</text>
<text class="muted small" x="464" y="180">the script module (.so, .dylib)</text>
<text class="ink mono" x="464" y="204">CoinRun.png</text>
<text class="muted small" x="464" y="224">the icon</text>
<text class="ink mono" x="464" y="248">ThirdPartyNotices.md</text>
<text class="muted small" x="464" y="268">notices of the engine's libraries</text>
<text class="ink mono" x="464" y="292">CoinRun.exe</text>
<text class="muted small" x="464" y="312">the game (CoinRun on Linux and macOS)</text>

<line class="line-ink" x1="328" y1="112" x2="436" y2="112"/>
<polygon class="ink" points="436,108.5 446,112 436,115.5"/>
