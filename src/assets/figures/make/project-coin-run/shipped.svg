<text class="ink mono small" x="48" y="96">Prefabs</text>
<text class="ink mono small" x="48" y="116">Materials/GoldGlow.stmat</text>
<text class="ink mono small" x="48" y="136">Sounds</text>
<text class="ink mono" x="32" y="166">CREDITS.md</text>
<text class="muted small" x="32" y="186">a row for each file you did not make</text>

