Plan: window 16..752 x 16..610 (H 626), title bar 16..52; list column x 32..216 as on world/projects-settings'
drawing (SettingsBrowser::BuildEntries), Input Actions selected; separator x 224; page x 240..736, labels x 240,
values x 392..736. Page: SettingsBrowser::DrawPage (heading, the section's description, cut), then
InputActionsPage::Draw (its caption, cut; the summary "2 maps · 7 actions": UI's six and Move), DrawMaps (UI first,
Gameplay selected as the first map that is not UI; Add Map; Map name with its trash button; Enabled at start),
DrawActions (Action, Kind, Dead zone 0.15 of 0 to 0.9, Bindings: a chip per binding with its device icon and its
remove button, then + and the capture button, dimmed for a Vector2), Add Action. Rows 30 apart from y 290. -->
