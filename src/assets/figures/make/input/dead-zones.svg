<svg xmlns="http://www.w3.org/2000/svg" class="book-drawing" viewBox="0 0 768 440">
<style>
svg.book-drawing { font-family: var(--sl-font, 'Inter Variable', system-ui, sans-serif); font-size: 16px; fill: var(--sl-color-white, #17181c); stroke: none; stroke-width: 1.5px; stroke-linejoin: round; }
svg.book-drawing text { stroke: none; }
svg.book-drawing .ink { fill: var(--sl-color-white, #17181c); }
svg.book-drawing .line-ink { stroke: var(--sl-color-white, #17181c); }
svg.book-drawing .muted { fill: var(--sl-color-gray-3, #555962); }
svg.book-drawing .line-muted { stroke: var(--sl-color-gray-3, #555962); }
svg.book-drawing .faint { fill: var(--sl-color-gray-5, #c1c3c8); }
svg.book-drawing .line-faint { stroke: var(--sl-color-gray-5, #c1c3c8); }
svg.book-drawing .ground { fill: var(--sl-color-black, #ffffff); }
svg.book-drawing .line-ground { stroke: var(--sl-color-black, #ffffff); }
svg.book-drawing .plate { fill: var(--sl-color-gray-6, #edeef3); }
svg.book-drawing .line-plate { stroke: var(--sl-color-gray-6, #edeef3); }
svg.book-drawing .blue { fill: var(--sl-color-blue-high, #0f1c8a); }
svg.book-drawing .line-blue { stroke: var(--sl-color-blue-high, #0f1c8a); }
svg.book-drawing .blue-area { fill: var(--sl-color-blue-low, #cfd4fc); }
svg.book-drawing .line-blue-area { stroke: var(--sl-color-blue-low, #cfd4fc); }
svg.book-drawing .green { fill: var(--sl-color-green-high, #28650b); }
svg.book-drawing .line-green { stroke: var(--sl-color-green-high, #28650b); }
svg.book-drawing .green-area { fill: var(--sl-color-green-low, #defbd0); }
svg.book-drawing .line-green-area { stroke: var(--sl-color-green-low, #defbd0); }
svg.book-drawing .purple { fill: var(--sl-color-purple-high, #660891); }
svg.book-drawing .line-purple { stroke: var(--sl-color-purple-high, #660891); }
svg.book-drawing .purple-area { fill: var(--sl-color-purple-low, #edd1fa); }
svg.book-drawing .line-purple-area { stroke: var(--sl-color-purple-low, #edd1fa); }
svg.book-drawing .orange { fill: var(--sl-color-orange-high, #73520d); }
svg.book-drawing .line-orange { stroke: var(--sl-color-orange-high, #73520d); }
svg.book-drawing .orange-area { fill: var(--sl-color-orange-low, #fceac5); }
svg.book-drawing .line-orange-area { stroke: var(--sl-color-orange-low, #fceac5); }
svg.book-drawing .red { fill: var(--sl-color-red-high, #8a0f3a); }
svg.book-drawing .line-red { stroke: var(--sl-color-red-high, #8a0f3a); }
svg.book-drawing .red-area { fill: var(--sl-color-red-low, #fad1df); }
svg.book-drawing .line-red-area { stroke: var(--sl-color-red-low, #fad1df); }
svg.book-drawing .small { font-size: 14px; }
svg.book-drawing .large { font-size: 20px; }
svg.book-drawing .bold { font-weight: 600; }
svg.book-drawing .mono { font-family: var(--sl-font-mono, 'JetBrains Mono Variable', ui-monospace, monospace); }
svg.book-drawing .halo { paint-order: stroke; stroke: var(--sl-color-black, #ffffff); stroke-width: 5px; }
</style>
<!-- Plan: two plots, stick x and y from -1 to 1, 160 units per 1 (frames 320 square). Left origin (196, 212),
right origin (572, 212); frames y 52 to 372. Dead zone 0.15 = 24 units. Stick (0.14, 0.90) = (22.4, -144).
Square zone reads (0, 0.88): arrow tip (0, -140.8). Round zone reads (0.14, 0.88), same direction as the stick:
arrow along u = (0.1537, -0.9881) to the dot's edge (r 2.5), tip (22.02, -141.53), base (20.48, -131.65).
Unit circle r 160 = the stick's reach, labelled along an arc of radius 151 (9 inside it) centred at 45 degrees. Tick row y 392, summary y 420, H 440. -->
<defs>
	<path id="dead-zones-reach" d="M 0 151 A 151 151 0 0 0 151 0" fill="none"/>
</defs>
<g transform="translate(196 212)">
	<rect x="-24" y="-160" width="48" height="320" class="plate"/>
	<rect x="-160" y="-24" width="320" height="48" class="plate"/>
	<line x1="-160" y1="0" x2="160" y2="0" class="line-faint" stroke-width="1"/>
	<line x1="0" y1="-160" x2="0" y2="160" class="line-faint" stroke-width="1"/>
	<circle cx="0" cy="0" r="160" fill="none" class="line-muted" stroke-dasharray="4 3"/>
	<rect x="-160" y="-160" width="320" height="320" fill="none" class="line-ink"/>
	<rect x="-24" y="-24" width="48" height="48" class="blue-area line-blue" stroke-width="2"/>
	<line x1="0" y1="0" x2="0" y2="-130.8" class="line-orange" stroke-width="2"/>
	<polygon points="0,-140.8 -3.5,-130.8 3.5,-130.8" class="orange"/>
	<circle cx="22.4" cy="-144" r="2.5" class="ink"/>
	<text x="0" y="-176" text-anchor="middle" class="ink bold">Square zone</text>
	<text x="32" y="-139" class="ink small halo">stick (0.14, 0.90)</text>
	<text x="-8" y="-86" text-anchor="end" class="orange small halo">reads (0, 0.88)</text>
	<text x="30" y="-84" class="muted small">x under 0.15:</text>
	<text x="30" y="-66" class="muted small">x reads 0</text>
	<text x="140" y="42" text-anchor="end" class="muted small">y reads 0</text>
	<text x="-30" y="42" text-anchor="end" class="blue small">dead zone 0.15</text>
	<text class="muted small"><textPath href="#dead-zones-reach" startOffset="50%" text-anchor="middle">the stick’s reach</textPath></text>
	<text x="-160" y="180" text-anchor="middle" class="muted small">−1</text>
	<text x="0" y="180" text-anchor="middle" class="muted small">x</text>
	<text x="160" y="180" text-anchor="middle" class="muted small">1</text>
	<text x="-166" y="-155" text-anchor="end" class="muted small">1</text>
	<text x="-166" y="5" text-anchor="end" class="muted small">y</text>
	<text x="-166" y="165" text-anchor="end" class="muted small">−1</text>
	<text x="0" y="208" text-anchor="middle" class="ink small">The x is lost: the ball goes straight forward.</text>
</g>
<g transform="translate(572 212)">
	<line x1="-160" y1="0" x2="160" y2="0" class="line-faint" stroke-width="1"/>
	<line x1="0" y1="-160" x2="0" y2="160" class="line-faint" stroke-width="1"/>
	<circle cx="0" cy="0" r="160" fill="none" class="line-muted" stroke-dasharray="4 3"/>
	<rect x="-160" y="-160" width="320" height="320" fill="none" class="line-ink"/>
	<circle cx="0" cy="0" r="24" class="blue-area line-blue" stroke-width="2"/>
	<line x1="0" y1="0" x2="20.48" y2="-131.65" class="line-orange" stroke-width="2"/>
	<polygon points="22.02,-141.53 17.02,-132.19 23.94,-131.11" class="orange"/>
	<circle cx="22.4" cy="-144" r="2.5" class="ink"/>
	<text x="0" y="-176" text-anchor="middle" class="ink bold">Round zone</text>
	<text x="32" y="-139" class="ink small halo">stick (0.14, 0.90)</text>
	<text x="5" y="-86" text-anchor="end" class="orange small halo">reads (0.14, 0.88)</text>
	<text x="-22" y="38" text-anchor="end" class="blue small">dead zone 0.15</text>
	<text class="muted small"><textPath href="#dead-zones-reach" startOffset="50%" text-anchor="middle">the stick’s reach</textPath></text>
	<text x="-160" y="180" text-anchor="middle" class="muted small">−1</text>
	<text x="0" y="180" text-anchor="middle" class="muted small">x</text>
	<text x="160" y="180" text-anchor="middle" class="muted small">1</text>
	<text x="-166" y="-155" text-anchor="end" class="muted small">1</text>
	<text x="-166" y="5" text-anchor="end" class="muted small">y</text>
	<text x="-166" y="165" text-anchor="end" class="muted small">−1</text>
	<text x="0" y="208" text-anchor="middle" class="ink small">The direction of the tilt stays.</text>
</g>
</svg>
