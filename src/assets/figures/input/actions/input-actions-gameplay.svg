<!--
Plan. The Input Actions page of the ThirdPerson sample, drawn from its code. Labels x 24, values x 148 to 448 (a
remove button 456 to 478), notes x 494 to 752 on the rows they name. Rows 22 high, 28 apart. Summary y 24, Maps
58 to 132, the map's table 142 to 192, Move 226 to 388, Look as a dashed line 400, Jump 434 to 512, the other five
as a dashed line 530, Add Action 562 to 584; H = 584 + 16.
Facts (StrataEditor/src/UI/InputActionsPage.cpp at 319075e3): Draw writes the summary "<n> maps · <n> actions";
DrawMaps lists the maps (the UI map's label adds "game UI navigation"), selects the first map that is not UI, adds
Add Map, then Map with a remove button and Enabled at start; DrawActions writes "Actions of <map>", per action Action
with a remove button, Kind, Dead zone only when the kind is not Button, Bindings; DrawBindings a chip with a remove
button per binding, then + and the capture button, disabled for a Vector2. Maps and actions:
Samples/ThirdPerson/ThirdPerson.stproj (Input.Actions). The chips' device icons and the page's opening caption are left out.
-->
