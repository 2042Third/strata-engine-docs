<circle class="line-green" fill="none" stroke-width="2.5" cx="492.7" cy="193" r="74"/>
<circle class="line-purple" fill="none" stroke-width="2.5" cx="577.1" cy="193" r="173.2"/>
<text class="ink small" text-anchor="middle" x="460" y="198">6.81 m</text>
<text class="ink small" text-anchor="middle" x="527" y="198">16.44 m</text>
