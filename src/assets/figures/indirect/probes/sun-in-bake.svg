<svg xmlns="http://www.w3.org/2000/svg" class="book-drawing" viewBox="0 0 768 344">
<style>
svg.book-drawing { font-family: var(--sl-font, 'Inter Variable', system-ui, sans-serif); font-size: 16px; fill: var(--sl-color-white, #17181c); stroke: none; stroke-width: 1.5px; stroke-linejoin: round; }
svg.book-drawing text { stroke: none; }
svg.book-drawing .ink { fill: var(--sl-color-white, #17181c); }
svg.book-drawing .line-ink { stroke: var(--sl-color-white, #17181c); }
svg.book-drawing .muted { fill: var(--sl-color-gray-3, #555962); }
svg.book-drawing .line-muted { stroke: var(--sl-color-gray-3, #555962); }
svg.book-drawing .faint { fill: var(--sl-color-gray-5, #c1c3c8); }
svg.book-drawing .line-faint { stroke: var(--sl-color-gray-5, #c1c3c8); }
svg.book-drawing .ground { fill: var(--sl-color-black, #ffffff); }
svg.book-drawing .line-ground { stroke: var(--sl-color-black, #ffffff); }
svg.book-drawing .plate { fill: var(--sl-color-gray-6, #edeef3); }
svg.book-drawing .line-plate { stroke: var(--sl-color-gray-6, #edeef3); }
svg.book-drawing .blue { fill: var(--sl-color-blue-high, #0f1c8a); }
svg.book-drawing .line-blue { stroke: var(--sl-color-blue-high, #0f1c8a); }
svg.book-drawing .blue-area { fill: var(--sl-color-blue-low, #cfd4fc); }
svg.book-drawing .line-blue-area { stroke: var(--sl-color-blue-low, #cfd4fc); }
svg.book-drawing .green { fill: var(--sl-color-green-high, #28650b); }
svg.book-drawing .line-green { stroke: var(--sl-color-green-high, #28650b); }
svg.book-drawing .green-area { fill: var(--sl-color-green-low, #defbd0); }
svg.book-drawing .line-green-area { stroke: var(--sl-color-green-low, #defbd0); }
svg.book-drawing .purple { fill: var(--sl-color-purple-high, #660891); }
svg.book-drawing .line-purple { stroke: var(--sl-color-purple-high, #660891); }
svg.book-drawing .purple-area { fill: var(--sl-color-purple-low, #edd1fa); }
svg.book-drawing .line-purple-area { stroke: var(--sl-color-purple-low, #edd1fa); }
svg.book-drawing .orange { fill: var(--sl-color-orange-high, #73520d); }
svg.book-drawing .line-orange { stroke: var(--sl-color-orange-high, #73520d); }
svg.book-drawing .orange-area { fill: var(--sl-color-orange-low, #fceac5); }
svg.book-drawing .line-orange-area { stroke: var(--sl-color-orange-low, #fceac5); }
svg.book-drawing .red { fill: var(--sl-color-red-high, #8a0f3a); }
svg.book-drawing .line-red { stroke: var(--sl-color-red-high, #8a0f3a); }
svg.book-drawing .red-area { fill: var(--sl-color-red-low, #fad1df); }
svg.book-drawing .line-red-area { stroke: var(--sl-color-red-low, #fad1df); }
svg.book-drawing .small { font-size: 14px; }
svg.book-drawing .large { font-size: 20px; }
svg.book-drawing .bold { font-weight: 600; }
svg.book-drawing .mono { font-family: var(--sl-font-mono, 'JetBrains Mono Variable', ui-monospace, monospace); }
svg.book-drawing .halo { paint-order: stroke; stroke: var(--sl-color-black, #ffffff); stroke-width: 5px; }
</style>
<!-- Plan: side view, ground at y 330 (x 16 to 752), wet band x 200 to 540. Sun (90, 90) r 20; tank x 600 to 700,
     y 120 to 330; highlight H (600, 200) on its left face. Probe center (400, 240) inside the probe's box, x 200 to 600,
     y 140 to 330, whose right face lies on the tank's left face. The sun's ray to H reflects off the vertical face along
     (-510, 110), which reaches x 400 at y 243, so the probe sees the highlight. The camera ray leaves O (62, 229) for
     P (297.2, 330), the point of the ground on the line from O to H mirrored in the ground (600, 460); its reflection
     rises along (302.8, -130) to H, where it leaves the box. Box projection looks the ray up in the direction from the
     probe's center to H, the direction in which the bake saw the highlight. Lowest text 362, H 384, drawn 40 higher:
     H 344. -->
<g transform="translate(0 -40)">
<line class="line-ink" x1="16" y1="330" x2="752" y2="330"/>
<rect class="blue-area" x="200" y="331" width="340" height="9"/>
<ellipse class="orange-area line-orange" cx="297" cy="336" rx="36" ry="3.5"/>
<text class="orange small" x="297" y="362" text-anchor="middle">bright blurred patch</text>
<text class="blue small" x="480" y="362" text-anchor="middle">wet ground</text>
<path class="line-muted" fill="none" stroke-dasharray="4 3" d="M600,140 H200 V330"/>
<text class="muted small" x="592" y="158" text-anchor="end">probe's box</text>
<circle class="orange-area line-orange" cx="90" cy="90" r="20"/>
<text class="orange" x="122" y="80">sun's disk, about 1e9 nits</text>
<rect class="plate line-ink" x="600" y="120" width="100" height="210" rx="8"/>
<text class="ink" x="650" y="108" text-anchor="middle">polished tank</text>
<text class="orange small" x="650" y="196" text-anchor="middle">the sun's</text>
<text class="orange small" x="650" y="214" text-anchor="middle">highlight</text>
<line class="line-orange" x1="109.6" y1="94.2" x2="585.3" y2="196.8"/>
<polygon class="orange" points="595.1,198.9 584.6,200.2 586.0,193.4"/>
<line class="line-purple" stroke-dasharray="4 3" x1="394.6" y1="237.4" x2="108.0" y2="98.7"/>
<line class="line-purple" stroke-dasharray="4 3" x1="405.9" y1="238.8" x2="595.1" y2="201.0"/>
<circle class="purple" cx="400" cy="240" r="6"/>
<text class="purple" x="388" y="256" text-anchor="end">probe's center</text>
<text class="purple small" x="460" y="208" text-anchor="middle">seen by the bake</text>
<rect class="plate line-ink" x="24" y="220" width="28" height="18" rx="2"/>
<rect class="plate line-ink" x="52" y="224" width="8" height="10"/>
<text class="ink" x="44" y="210" text-anchor="middle">camera</text>
<line class="line-ink" x1="62" y1="229" x2="288.0" y2="326.1"/>
<polygon class="ink" points="297.2,330 286.6,329.3 289.4,322.8"/>
<line class="line-ink" x1="297.2" y1="330" x2="586.2" y2="205.9"/>
<polygon class="ink" points="595.4,202.0 587.6,209.1 584.8,202.7"/>
<text class="ink small" x="474" y="274">reflected ray</text>
<circle class="orange" cx="600" cy="200" r="5"/>
</g>
</svg>
