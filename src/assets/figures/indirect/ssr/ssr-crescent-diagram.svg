<circle class="plate line-muted" stroke-width="2" cx="340" cy="250" r="80"/>
<polygon class="ink" points="60,90 48,83 48,97"/>
<text class="ink small" x="40" y="74">camera</text>
<line class="line-blue" stroke-width="1.5" x1="60" y1="90" x2="500" y2="195.3"/>
<line class="line-muted" stroke-width="1.5" stroke-dasharray="4 3" x1="60" y1="90" x2="412.5" y2="216.2"/>
<text class="muted small" x="24" y="142">the depth buffer</text>
<text class="muted small" x="24" y="160">holds the front only</text>
