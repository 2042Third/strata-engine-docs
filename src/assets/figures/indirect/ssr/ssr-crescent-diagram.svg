<line class="line-orange" stroke-width="2" x1="305.4" y1="177.8" x2="285.5" y2="136.3"/>
<polygon class="orange" points="281.2,127.3 288.7,134.8 282.3,137.8"/>
<line class="line-blue" stroke-width="2" x1="305.4" y1="177.8" x2="268.4" y2="186.7"/>
<polygon class="blue" points="258.7,189 269.2,190.1 267.6,183.3"/>
<circle class="orange" cx="305.4" cy="177.8" r="5"/>
