<svg xmlns="http://www.w3.org/2000/svg" class="book-drawing" viewBox="0 0 768 446">
<style>
svg.book-drawing { font-family: var(--sl-font, 'Inter Variable', system-ui, sans-serif); font-size: 16px; fill: var(--sl-color-white, #17181c); stroke: none; stroke-width: 1.5px; stroke-linejoin: round; }
svg.book-drawing text { stroke: none; }
svg.book-drawing .ink { fill: var(--sl-color-white, #17181c); }
svg.book-drawing .line-ink { stroke: var(--sl-color-white, #17181c); }
svg.book-drawing .muted { fill: var(--sl-color-gray-3, #555962); }
svg.book-drawing .line-muted { stroke: var(--sl-color-gray-3, #555962); }
svg.book-drawing .faint { fill: var(--sl-color-gray-5, #c1c3c8); }
svg.book-drawing .line-faint { stroke: var(--sl-color-gray-5, #c1c3c8); }
svg.book-drawing .ground { fill: var(--sl-color-black, #ffffff); }
svg.book-drawing .line-ground { stroke: var(--sl-color-black, #ffffff); }
svg.book-drawing .plate { fill: var(--sl-color-gray-6, #edeef3); }
svg.book-drawing .line-plate { stroke: var(--sl-color-gray-6, #edeef3); }
svg.book-drawing .blue { fill: var(--sl-color-blue-high, #0f1c8a); }
svg.book-drawing .line-blue { stroke: var(--sl-color-blue-high, #0f1c8a); }
svg.book-drawing .blue-area { fill: var(--sl-color-blue-low, #cfd4fc); }
svg.book-drawing .line-blue-area { stroke: var(--sl-color-blue-low, #cfd4fc); }
svg.book-drawing .green { fill: var(--sl-color-green-high, #28650b); }
svg.book-drawing .line-green { stroke: var(--sl-color-green-high, #28650b); }
svg.book-drawing .green-area { fill: var(--sl-color-green-low, #defbd0); }
svg.book-drawing .line-green-area { stroke: var(--sl-color-green-low, #defbd0); }
svg.book-drawing .purple { fill: var(--sl-color-purple-high, #660891); }
svg.book-drawing .line-purple { stroke: var(--sl-color-purple-high, #660891); }
svg.book-drawing .purple-area { fill: var(--sl-color-purple-low, #edd1fa); }
svg.book-drawing .line-purple-area { stroke: var(--sl-color-purple-low, #edd1fa); }
svg.book-drawing .orange { fill: var(--sl-color-orange-high, #73520d); }
svg.book-drawing .line-orange { stroke: var(--sl-color-orange-high, #73520d); }
svg.book-drawing .orange-area { fill: var(--sl-color-orange-low, #fceac5); }
svg.book-drawing .line-orange-area { stroke: var(--sl-color-orange-low, #fceac5); }
svg.book-drawing .red { fill: var(--sl-color-red-high, #8a0f3a); }
svg.book-drawing .line-red { stroke: var(--sl-color-red-high, #8a0f3a); }
svg.book-drawing .red-area { fill: var(--sl-color-red-low, #fad1df); }
svg.book-drawing .line-red-area { stroke: var(--sl-color-red-low, #fad1df); }
svg.book-drawing .small { font-size: 14px; }
svg.book-drawing .large { font-size: 20px; }
svg.book-drawing .bold { font-weight: 600; }
svg.book-drawing .mono { font-family: var(--sl-font-mono, 'JetBrains Mono Variable', ui-monospace, monospace); }
svg.book-drawing .halo { paint-order: stroke; stroke: var(--sl-color-black, #ffffff); stroke-width: 5px; }
</style>
<!-- Plan: steps 1 to 6 at x 120 + 88 (step - 1); the horizon's cosine v at y 380 - 320 v. Decay 0.1. Pole samples 0.2, 0.8, then 0.2; board 0.2, 0.8, 0.8, 0.8, 0.2, 0.2. Without relaxation both give the same line, so one dashed line stands for both. Values: pole 0.200, 0.800, 0.740, 0.686, 0.637, 0.594; board 0.200, 0.800, 0.800, 0.800, 0.740, 0.686. -->
<line x1="112" y1="380" x2="568" y2="380" class="line-ink"/>
<text x="104" y="385" class="muted small" text-anchor="end">0.0</text>
<line x1="112" y1="316" x2="568" y2="316" class="line-faint"/>
<text x="104" y="321" class="muted small" text-anchor="end">0.2</text>
<line x1="112" y1="252" x2="568" y2="252" class="line-faint"/>
<text x="104" y="257" class="muted small" text-anchor="end">0.4</text>
<line x1="112" y1="188" x2="568" y2="188" class="line-faint"/>
<text x="104" y="193" class="muted small" text-anchor="end">0.6</text>
<line x1="112" y1="124" x2="568" y2="124" class="line-faint"/>
<text x="104" y="129" class="muted small" text-anchor="end">0.8</text>
<line x1="112" y1="60" x2="568" y2="60" class="line-faint"/>
<text x="104" y="65" class="muted small" text-anchor="end">1.0</text>
<text x="120" y="402" class="muted small" text-anchor="middle">1</text>
<text x="208" y="402" class="muted small" text-anchor="middle">2</text>
<text x="296" y="402" class="muted small" text-anchor="middle">3</text>
<text x="384" y="402" class="muted small" text-anchor="middle">4</text>
<text x="472" y="402" class="muted small" text-anchor="middle">5</text>
<text x="560" y="402" class="muted small" text-anchor="middle">6</text>
<text x="340" y="428" class="ink" text-anchor="middle">step</text>
<text x="40" y="220" class="ink" text-anchor="middle" transform="rotate(-90 40 220)">horizon (cosine)</text>
<polyline points="120,316 208,124 296,124 384,124 472,143.2 560,160.5" class="line-blue" fill="none" stroke-width="2.5"/>
<circle cx="120" cy="316" r="4" class="blue"/>
<circle cx="208" cy="124" r="4" class="blue"/>
<circle cx="296" cy="124" r="4" class="blue"/>
<circle cx="384" cy="124" r="4" class="blue"/>
<circle cx="472" cy="143.2" r="4" class="blue"/>
<circle cx="560" cy="160.5" r="4" class="blue"/>
<polyline points="120,316 208,124 296,143.2 384,160.5 472,176 560,190" class="line-orange" fill="none" stroke-width="2.5"/>
<circle cx="120" cy="316" r="4" class="orange"/>
<circle cx="208" cy="124" r="4" class="orange"/>
<circle cx="296" cy="143.2" r="4" class="orange"/>
<circle cx="384" cy="160.5" r="4" class="orange"/>
<circle cx="472" cy="176" r="4" class="orange"/>
<circle cx="560" cy="190" r="4" class="orange"/>
<polyline points="120,316 208,124 296,124 384,124 472,124 560,124" class="line-muted" fill="none" stroke-width="2.5" stroke-dasharray="4 3"/>
<text x="560" y="112" class="muted" text-anchor="end">without relaxation: pole and board, 0.8</text>
<text x="574" y="165.5" class="blue">board, 0.686</text>
<text x="574" y="195" class="orange">pole, 0.594</text>
<text x="126" y="338" class="muted small">the wall, 0.2</text>
</svg>
