# Spelling gate (typos 1.52.1, from tools/toolchain.json). Quotes of the engine are the engine's own text: when typos
# flags one, the fix belongs in the engine, so excerpt bodies are not checked here (tools/excerpts.py keeps them exact).
[files]
extend-exclude = [
	"plan/",
	"node_modules/",
	".tools/",
	"dist/",
	"stage/",
	".cache/",
	"package-lock.json",
	"src/assets/",
	"*.svg",
	# 12dicts' word lists and AGID's notice, kept exactly as published (tools/wordlists.py check proves it): their
	# variant spellings ("payed", "leafs") are words of the lists, not mistakes of the book.
	"tools/data/common-words.txt",
	"tools/data/verbs.txt",
	"tools/data/12dicts-notice.txt",
]

[default]
# Literal strings ('...'): the regular expressions reach typos exactly as written (in a TOML "..." string, \b would be a
# backspace character and \n a line break).
extend-ignore-re = [
	# A fence that quotes the engine, from its opening line to the closing line of the same length, at any indentation
	# (quotes in list items are indented). Rust's regex has no back-references, so each marker length the tools write
	# has its own pattern: tools/excerpts.py fill lengthens a fence whose lines hold a fence of their own.
	'(?sm)^[ \t]*```[a-z+]* src="[^"]+"[^\n]*\n.*?\n[ \t]*```[ \t]*$',
	'(?sm)^[ \t]*````[a-z+]* src="[^"]+"[^\n]*\n.*?\n[ \t]*````[ \t]*$',
	'(?sm)^[ \t]*`````[a-z+]* src="[^"]+"[^\n]*\n.*?\n[ \t]*`````[ \t]*$',
	# Commit ids and hashes.
	'\b[0-9a-f]{12,64}\b',
	# The short blob ids of a patch's "index" lines, and hexadecimal colors and IDs in capitals (9BA1A9, 767BA8F8BB482CB8).
	'(?m)^index [0-9a-f]{7,}\.\.[0-9a-f]{7,}',
	'\b[0-9A-F]{6,}\b',
	# Mathematics: the matrix product BA beside AB.
	'\$BA\$',
	'(?m)^BA =',
	# Tokens typos splits wrongly: 65535ths, ANDed, PNGs.
	'\b[0-9]+ths\b',
	'\bANDed\b',
	'\bPNGs\b',
	# Text a page shows as data: the strings "ab" and "ba" of the checksum example, and the word "Café" cut at its é.
	'["`]ba["`:]',
	'(?m)^ba: ',
	'["`]Caf["`]',
]

[default.extend-words]
# Engine and library names.
NVRHI = "NVRHI"
EnTT = "EnTT"
# Level of detail: the outline's page draw/lod, and LOD in the engine's names.
lod = "lod"
# Names of people and of things: Bui Tuong Phong, Gilbert Strang, structured exception handling (SEH, glossary id
# seh), the TrueType table loca, std::countr_zero, the texture map "metalness", look-alikes, a diagram's node FO.
Bui = "Bui"
Strang = "Strang"
SEH = "SEH"
seh = "seh"
loca = "loca"
countr = "countr"
Metalness = "Metalness"
metalness = "metalness"
alikes = "alikes"
FO = "FO"
# Wrong names that pages write on purpose, to show how the engine refuses them (editor/commands, automation/json-rpc,
# make/commands, make/animation, basics/programming-3), and the cut texts and hunk headers that show them.
nam = "nam"
entit = "entit"
entites = "entites"
Transfrom = "Transfrom"
Flaot = "Flaot"
Updat = "Updat"
ontroller = "ontroller"
registe = "registe"
# generated by tools/names.py spelling: the words of page ids and engine names that typos would flag; do not edit
abd = "abd"
astroid = "astroid"
horizonal = "horizonal"
leafs = "leafs"
# end of the generated block
